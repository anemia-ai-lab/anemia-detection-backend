# CI: lint, tests API/ML, smoke opcional contra AWS (SMOKE_BASE_URL).
name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 15 * * 1,4"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-anon-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install MediaPipe system libraries (Linux)
        run: make install-mediapipe-system-libs
      - name: Lint
        run: make lint
      - name: Test backend without TensorFlow
        run: |
          make download-hand-landmarker
          make test

  ml-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ML tests in Docker (TensorFlow 2.19.1 / Linux)
        run: make ml-test-docker

  smoke-prod:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install MediaPipe system libraries (Linux)
        run: make install-mediapipe-system-libs
      - name: Download Hand Landmarker (smoke preflight)
        run: make download-hand-landmarker
      - name: Smoke E2E (prod)
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "Skip smoke-prod: set repository variable SMOKE_BASE_URL (ALB DNS, sin barra final)"
            exit 0
          fi
          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ] || [ -z "${METRICS_BEARER_TOKEN:-}" ]; then
            echo "Skip smoke-prod: configure secrets SMOKE_EMAIL, SMOKE_PASSWORD, METRICS_BEARER_TOKEN"
            exit 0
          fi
          if ! python3 scripts/smoke_prod.py --check-render-url "${SMOKE_BASE_URL}"; then
            echo "Skip smoke-prod: SMOKE_BASE_URL apunta a Render (retirado). Actualiza la variable a http://<LoadBalancerDNS>"
            exit 0
          fi
          make smoke-prod

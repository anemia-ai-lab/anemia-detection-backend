# Deploy API to AWS ECS Fargate (manual dispatch).
name: Deploy AWS

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag (default: git SHA)"
        required: false
        default: ""

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint and test API
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-anon-key-not-real
        run: make lint && make test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install CDK CLI and Python deps
        working-directory: infra
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm install -g aws-cdk@2

      # ECR uses RemovalPolicy.RETAIN — if the stack was deleted, the repo can block a fresh create.
      - name: Recover stuck stack or orphan ECR
        run: |
          set -euo pipefail
          STACK="AnemiaApiStack"
          ECR_REPO="anemia-detection-backend"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")

          echo "CloudFormation stack status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              echo "Stack is healthy; continuing."
              ;;
            REVIEW_IN_PROGRESS|CREATE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED)
              echo "Deleting failed or stuck stack ($STATUS)..."
              aws cloudformation delete-stack --stack-name "$STACK" --region "$AWS_REGION"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$AWS_REGION"
              STATUS="NOT_FOUND"
              ;;
            DELETE_IN_PROGRESS)
              echo "Waiting for stack deletion to finish..."
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$AWS_REGION"
              STATUS="NOT_FOUND"
              ;;
            NOT_FOUND)
              echo "No active stack."
              ;;
            *)
              echo "Stack in state $STATUS; not auto-recovering."
              ;;
          esac

          if aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
            if [ "$STATUS" = "NOT_FOUND" ]; then
              echo "Removing orphan ECR repository $ECR_REPO (left after stack delete with RETAIN)."
              aws ecr delete-repository --repository-name "$ECR_REPO" --region "$AWS_REGION" --force
            fi
          fi

      - name: CDK deploy (infra)
        working-directory: infra
        id: cdk_bootstrap
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name AnemiaApiStack --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")

          HAS_IMAGE="false"
          if aws ecr describe-images \
            --repository-name anemia-detection-backend \
            --region "$AWS_REGION" \
            --image-ids imageTag=latest >/dev/null 2>&1; then
            HAS_IMAGE="true"
          fi

          echo "Stack status: $STATUS, ECR latest: $HAS_IMAGE"

          if [ "$STATUS" = "CREATE_COMPLETE" ] || [ "$STATUS" = "UPDATE_COMPLETE" ] || [ "$STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            if [ "$HAS_IMAGE" = "true" ]; then
              echo "Healthy stack with image; deploying desiredCount=1"
              cdk deploy --require-approval never -c desiredCount=1
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            else
              echo "Stack exists but ECR has no :latest; scale to 0 then push image"
              cdk deploy --require-approval never -c desiredCount=0
              echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Bootstrap deploy; desiredCount=0 until image is pushed"
            cdk deploy --require-approval never -c desiredCount=0
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        id: ecr
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/anemia-detection-backend"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "uri=${ECR_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          docker build --platform linux/amd64 -f Dockerfile -t "${{ steps.ecr.outputs.uri }}:${TAG}" -t "${{ steps.ecr.outputs.uri }}:latest" .
          docker push "${{ steps.ecr.outputs.uri }}:${TAG}"
          docker push "${{ steps.ecr.outputs.uri }}:latest"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Verify ECR image (latest)
        run: |
          aws ecr describe-images \
            --repository-name anemia-detection-backend \
            --region "$AWS_REGION" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' --output text

      - name: Scale up ECS after image push
        if: steps.cdk_bootstrap.outputs.bootstrap == 'true'
        run: |
          aws ecs update-service \
            --cluster anemia-api-cluster \
            --service anemia-api-service \
            --desired-count 1 \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: CDK deploy (sync desiredCount=1)
        if: steps.cdk_bootstrap.outputs.bootstrap == 'true'
        working-directory: infra
        run: |
          aws ecs wait services-stable \
            --cluster anemia-api-cluster \
            --services anemia-api-service \
            --region "$AWS_REGION"
          cdk deploy --require-approval never -c desiredCount=1

      - name: Force ECS redeployment
        if: steps.cdk_bootstrap.outputs.bootstrap != 'true'
        run: |
          aws ecs update-service \
            --cluster anemia-api-cluster \
            --service anemia-api-service \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for service stability
        if: steps.cdk_bootstrap.outputs.bootstrap != 'true'
        run: |
          aws ecs wait services-stable \
            --cluster anemia-api-cluster \
            --services anemia-api-service \
            --region "$AWS_REGION"

      - name: Smoke prod (optional)
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
        run: |
          if [ -z "${SMOKE_BASE_URL:-}" ] || [ -z "${SMOKE_EMAIL:-}" ]; then
            echo "Skip smoke: set SMOKE_BASE_URL and SMOKE_* secrets"
            exit 0
          fi
          make smoke-prod
